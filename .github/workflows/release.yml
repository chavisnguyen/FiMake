name: Release assets
# User flow: create a GitHub Release (tag, e.g. v1.0.0) -> this workflow
# gates, builds standalone MCP binaries (no Node/npm needed by users) +
# the sideload plugin zip, attaches everything to the Release, and THEN
# bumps the Homebrew tap. Strict job order in one workflow:
#   gate -> {plugin-zip, binary} -> attach -> bump-tap
# (bump-tap used to be a separate workflow racing release.yml on the same
# `release: published` event with a 30-minute polling loop — now it simply
# `needs: [attach]`, so the tap can never point at missing assets.)
# Requires repo secret TAP_TOKEN: a PAT (classic, `repo` scope — or
# fine-grained with contents:write on homebrew-fimake), because the default
# GITHUB_TOKEN cannot push to another repository.
on:
  release:
    types: [published]
permissions:
  contents: write # attach assets to the Release
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard - package versions match release tag
        # brew test asserts `fimake --version` == tag version, and --version
        # is baked from mcp/package.json at build time. Fail fast here
        # instead of shipping a release whose binary fails `brew test`.
        run: |
          TAG="${{ github.ref_name }}"
          test "$(python3 -c "import json; print(json.load(open('mcp/package.json'))['version'])")" = "${TAG#v}"
          test "$(python3 -c "import json; print(json.load(open('plugin/package.json'))['version'])")" = "${TAG#v}"
      - uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # NOTE: build BEFORE check — the e2e replay suite spawns mcp/dist and
      # fails on a fresh checkout without it (`make check` runs test first).
      # (test.yml already builds first for the same reason.)
      - name: Build first (e2e needs dist)
        run: make build
      - name: Gate (typecheck + lint + test + build)
        run: make check

  plugin-zip:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package sideload plugin (manifest.json + dist/)
        run: make package-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: fimake-plugin.zip

  manpage:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard - manpage renders without warnings
        run: |
          sudo apt-get install -y mandoc
          mandoc -T lint man/fimake.1
      - name: Stage flat asset (merge-multiple flattens dirs)
        run: cp man/fimake.1 fimake.1
      - uses: actions/upload-artifact@v4
        with:
          name: manpage
          path: fimake.1

  binary:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: fimake-macos-arm64
          - os: macos-15-intel
            asset: fimake-macos-x64
          - os: ubuntu-latest
            asset: fimake-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      # NOTE: no pnpm install / pnpm build here on purpose — the next step
      # wipes node_modules and rebuilds dist via npm (real files, no pnpm
      # symlinks), so installing first would only waste CI minutes.
      - name: Install prod deps (npm, real files) and build standalone binary (caxa bundles Node 22)
        working-directory: ./mcp
        shell: bash
        run: |
          # npm creates real files in node_modules (no pnpm symlinks),
          # so the caxa-extracted binary can resolve all imports.
          # zod-to-json-schema is now a declared dep of mcp/package.json
          # (it is imported by @modelcontextprotocol/sdk but missing
          # from its published package.json).
          rm -rf node_modules
          npm install --ignore-scripts --no-package-lock
          test -f node_modules/zod-to-json-schema/package.json
          pnpm build
          pnpm dlx @cdxgen/caxa --input . --output ${{ matrix.asset }} -- "{{caxa}}/node_modules/.bin/node" "{{caxa}}/dist/index.js"
      - name: Smoke-test standalone binary
        working-directory: ./mcp
        shell: bash
        # The binary must boot and report its version on stdout.
        # Catches broken staging (e.g. missing node_modules) here in CI
        # instead of after users install via Homebrew.
        run: |
          test -x ${{ matrix.asset }}
          ./${{ matrix.asset }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          # caxa ran with working-directory ./mcp, so the binary lives there.
          path: mcp/${{ matrix.asset }}
          if-no-files-found: error

  attach:
    needs: [gate, plugin-zip, manpage, binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: ls -la assets
      - name: Guard - all 5 assets present
        # Never attach an incomplete release: 3 binaries + plugin zip + manpage.
        # (A warn-only upload would otherwise ship a broken tap update.)
        run: |
          test -f assets/fimake-macos-arm64
          test -f assets/fimake-macos-x64
          test -f assets/fimake-linux-x64
          test -f assets/fimake-plugin.zip
          test -f assets/fimake.1
      - name: Attach assets to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # NOTE: --repo is required — this job has no checkout, so gh
        # cannot resolve the repo from git remotes.
        run: gh release upload ${{ github.ref_name }} assets/* --clobber --repo chavisnguyen/FiMake

  bump-tap:
    # Runs only after attach: the tap formula points at release download URLs,
    # so it must never update before the binaries exist (no polling needed).
    needs: [attach]
    runs-on: ubuntu-latest
    steps:
      - name: Download release binaries + bump tap formula
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"   # e.g. v1.0.0
          WORK=$(mktemp -d)
          cd "$WORK"
          # attach already finished in this workflow run — single download, no retry loop.
          gh release download "$TAG" --repo chavisnguyen/FiMake \
            --pattern 'fimake-macos-arm64' \
            --pattern 'fimake-macos-x64' \
            --pattern 'fimake-linux-x64' \
            --pattern 'fimake.1'
          test -f fimake-macos-arm64 && test -f fimake-macos-x64 && test -f fimake-linux-x64 && test -f fimake.1
          SHA_ARM=$(sha256sum fimake-macos-arm64 | cut -d' ' -f1)
          SHA_INTEL=$(sha256sum fimake-macos-x64 | cut -d' ' -f1)
          SHA_LINUX=$(sha256sum fimake-linux-x64 | cut -d' ' -f1)
          SHA_MAN=$(sha256sum fimake.1 | cut -d' ' -f1)
          git clone "https://${GH_TOKEN}@github.com/chavisnguyen/homebrew-fimake" tap --depth 1
          cd tap
          git checkout master
          python3 - "$TAG" "$SHA_ARM" "$SHA_INTEL" "$SHA_LINUX" "$SHA_MAN" <<'EOF'
          import re, sys
          tag, arm, intel, linux, man = sys.argv[1:6]
          p = "Formula/fimake.rb"
          s = open(p).read()
          s = re.sub(r"https://github\.com/chavisnguyen/FiMake/releases/download/[^/\"']+/fimake-macos-arm64",
                     f"https://github.com/chavisnguyen/FiMake/releases/download/{tag}/fimake-macos-arm64", s)
          s = re.sub(r"https://github\.com/chavisnguyen/FiMake/releases/download/[^/\"']+/fimake-macos-x64",
                     f"https://github.com/chavisnguyen/FiMake/releases/download/{tag}/fimake-macos-x64", s)
          s = re.sub(r"https://github\.com/chavisnguyen/FiMake/releases/download/[^/\"']+/fimake-linux-x64",
                     f"https://github.com/chavisnguyen/FiMake/releases/download/{tag}/fimake-linux-x64", s)
          s = re.sub(r'(fimake-macos-arm64"\n\s*sha256 ")[0-9a-f]{64}', rf"\g<1>{arm}", s)
          s = re.sub(r'(fimake-macos-x64"\n\s*sha256 ")[0-9a-f]{64}', rf"\g<1>{intel}", s)
          s = re.sub(r'(fimake-linux-x64"\n\s*sha256 ")[0-9a-f]{64}', rf"\g<1>{linux}", s)
          # NOTE: no `postinstall` that auto-runs `install-plugin` on purpose.
          # postinstall runs sandboxed + non-interactive: it can't quit Figma
          # (osascript GUI), and patching settings.json while Figma runs gets
          # overwritten on quit. Brew also discourages touching $HOME there.
          # The `caveats` block below is the supported pattern — brew prints it
          # after every install/upgrade, and `fimake doctor` re-checks plugin
          # registration on demand.
          # `brew services start fimake` = the one shared streamable-http
          # server every MCP client connects to (docs/quickstart.md).
          # Blocks are stripped and re-inserted every release so edits here
          # always reach the tap.
          # The manpage ships as a release asset (man/fimake.1 in this repo)
          # and installs via a `resource` stanza: the formula's `url` is a
          # single-file binary, so the manpage needs its own download with
          # its own sha256. Same strip + re-insert treatment as service/caveats.
          man_block_lines = [
              '  resource "manpage" do',
              f'    url "https://github.com/chavisnguyen/FiMake/releases/download/{tag}/fimake.1"',
              f'    sha256 "{man}"',
              "  end",
              "",
              "",
          ]
          man_block = "\n".join(man_block_lines)
          s = re.sub(r'  resource "manpage" do\n.*?\n  end\n\n?', "", s, flags=re.S)
          s = s.replace("  def install", man_block + "  def install", 1)
          # Wire the staged resource into `def install` (idempotent).
          s = re.sub(r'    resource\("manpage"\)\.stage \{ man1\.install "fimake\.1" \}\n', "", s)
          s = s.replace(
              '    bin.install asset => "fimake"\n',
              '    bin.install asset => "fimake"\n    resource("manpage").stage { man1.install "fimake.1" }\n',
              1,
          )
          # Assert the manpage in `brew test` so a broken resource fails CI,
          # not users (idempotent: no-op once present).
          if 'man1/"fimake.1"' not in s:
              s = s.replace(
                  'assert_match version.to_s, shell_output("#{bin}/fimake --version")',
                  'assert_match version.to_s, shell_output("#{bin}/fimake --version")\n    assert_predicate man1/"fimake.1", :exist?',
                  1,
              )
          blocks_lines = [
              "  service do",
              "    run [opt_bin/\"fimake\"]",
              "    environment_variables TRANSPORT: \"streamable-http\"",
              "    keep_alive true",
              "    log_path var/\"log/fimake.log\"",
              "    error_log_path var/\"log/fimake.log\"",
              "  end",
              "",
              "  def caveats",
              "    <<~EOS",
              "      Next steps (one-time):",
              "        fimake install-plugin        # register the Figma plugin (macOS)",
              "        brew services start fimake   # run the shared server in the background",
              "      Then add http://localhost:10101/mcp to your MCP client.",
              "      Run `fimake doctor` if anything looks off.",
              "    EOS",
              "  end",
              "",
              "",
          ]
          blocks = "\n".join(blocks_lines)
          s = re.sub(r"  service do\n.*?\n  end\n\n", "", s, flags=re.S)
          s = re.sub(r"  def caveats\n.*?\n  end\n\n", "", s, flags=re.S)
          s = s.replace("  test do", blocks + "  test do", 1)
          open(p, "w").write(s)
          EOF
          git diff --stat
          git add Formula/fimake.rb
          git -c "user.name=fimake-bot" -c "user.email=fimake-bot@users.noreply.github.com" \
            commit -m "fimake ${TAG}" && git push || echo "nothing to bump"
