name: Release assets
# User flow: create a GitHub Release (tag, e.g. v1.0.0) -> this workflow
# gates, builds standalone MCP binaries (no Node/npm needed by users) +
# the sideload plugin zip, and attaches everything to the Release.
on:
  release:
    types: [published]
permissions:
  contents: write # attach assets to the Release
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard - package versions match release tag
        # brew test asserts `fimake --version` == tag version, and --version
        # is baked from mcp/package.json at build time. Fail fast here
        # instead of shipping a release whose binary fails `brew test`.
        run: |
          TAG="${{ github.ref_name }}"
          test "$(python3 -c "import json; print(json.load(open('mcp/package.json'))['version'])")" = "${TAG#v}"
          test "$(python3 -c "import json; print(json.load(open('plugin/package.json'))['version'])")" = "${TAG#v}"
      - uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Gate (typecheck + lint + test + build)
        run: make check

  plugin-zip:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package sideload plugin (manifest.json + dist/)
        run: make package-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: fimake-plugin.zip

  binary:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: fimake-macos-arm64
          - os: macos-15-intel
            asset: fimake-macos-x64
          - os: ubuntu-latest
            asset: fimake-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      # NOTE: no pnpm install / pnpm build here on purpose — the next step
      # wipes node_modules and rebuilds dist via npm (real files, no pnpm
      # symlinks), so installing first would only waste CI minutes.
      - name: Install prod deps (npm, real files) and build standalone binary (caxa bundles Node 22)
        working-directory: ./mcp
        shell: bash
        run: |
          # npm creates real files in node_modules (no pnpm symlinks),
          # so the caxa-extracted binary can resolve all imports.
          # zod-to-json-schema is now a declared dep of mcp/package.json
          # (it is imported by @modelcontextprotocol/sdk but missing
          # from its published package.json).
          rm -rf node_modules
          npm install --ignore-scripts --no-package-lock
          test -f node_modules/zod-to-json-schema/package.json
          pnpm build
          pnpm dlx @cdxgen/caxa --input . --output ${{ matrix.asset }} -- "{{caxa}}/node_modules/.bin/node" "{{caxa}}/dist/index.js"
      - name: Smoke-test standalone binary
        working-directory: ./mcp
        shell: bash
        # The binary must boot and report its version on stdout.
        # Catches broken staging (e.g. missing node_modules) here in CI
        # instead of after users install via Homebrew.
        run: |
          test -x ${{ matrix.asset }}
          ./${{ matrix.asset }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          # caxa ran with working-directory ./mcp, so the binary lives there.
          path: mcp/${{ matrix.asset }}
          if-no-files-found: error

  attach:
    needs: [gate, plugin-zip, binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: ls -la assets
      - name: Guard - all 4 assets present
        # Never attach an incomplete release: 3 binaries + plugin zip.
        # (A warn-only upload would otherwise ship a broken tap update.)
        run: |
          test -f assets/fimake-macos-arm64
          test -f assets/fimake-macos-x64
          test -f assets/fimake-linux-x64
          test -f assets/fimake-plugin.zip
      - name: Attach assets to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # NOTE: --repo is required — this job has no checkout, so gh
        # cannot resolve the repo from git remotes.
        run: gh release upload ${{ github.ref_name }} assets/* --clobber --repo chavisnguyen/FiMake
