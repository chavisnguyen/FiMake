name: Release assets
# User flow: create a GitHub Release (tag, e.g. v1.0.0) -> this workflow
# gates, builds standalone MCP binaries (no Node/npm needed by users) +
# the sideload plugin zip, and attaches everything to the Release.
on:
  release:
    types: [published]
permissions:
  contents: write # attach assets to the Release
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Gate (typecheck + lint + test + build)
        run: make check

  plugin-zip:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package sideload plugin (manifest.json + dist/)
        run: make package-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: fimake-plugin.zip

  binary:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: fimake-macos-arm64
          - os: macos-15-intel
            asset: fimake-macos-x64
          - os: ubuntu-latest
            asset: fimake-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build MCP server
        working-directory: ./mcp
        run: pnpm build
      - name: Install prod deps (npm, real files) and build standalone binary (caxa bundles Node 22)
        working-directory: ./mcp
        shell: bash
        run: |
          # npm creates real files in node_modules (no pnpm symlinks),
          # so the caxa-extracted binary can resolve all imports.
          # zod-to-json-schema is a transitive dep of @modelcontextprotocol/sdk
          # that npm doesn't hoist, so install it explicitly.
          npm install --ignore-scripts
          npm install zod-to-json-schema --ignore-scripts --no-save
          pnpm build
          pnpm dlx @cdxgen/caxa --input . --output ${{ matrix.asset }} -- "{{caxa}}/node_modules/.bin/node" "{{caxa}}/dist/index.js"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  attach:
    needs: [gate, plugin-zip, binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: ls -la assets
      - name: Attach assets to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # NOTE: --repo is required — this job has no checkout, so gh
        # cannot resolve the repo from git remotes.
        run: gh release upload ${{ github.ref_name }} assets/* --clobber --repo chavisnguyen/FiMake
