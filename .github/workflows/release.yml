name: Release assets
# User flow: create a GitHub Release (tag, e.g. v1.0.0) -> this workflow
# gates, builds standalone MCP binaries (no Node/npm needed by users) +
# the sideload plugin zip, and attaches everything to the Release.
on:
  release:
    types: [published]
permissions:
  contents: write # attach assets to the Release
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Gate (typecheck + lint + test + build)
        run: make check

  plugin-zip:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Package sideload plugin (manifest.json + dist/)
        run: make package-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: fimake-plugin.zip

  binary:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: fimake-macos-arm64
          - os: macos-15-intel
            asset: fimake-macos-x64
          - os: ubuntu-latest
            asset: fimake-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build MCP server
        working-directory: ./mcp
        run: pnpm build
      - name: Install prod deps (hoisted) and stage
        shell: bash
        run: |
          rm -rf stage
          mkdir stage
          cp mcp/package.json stage/
          cp -rL mcp/dist stage/
          # --node-linker=hoisted writes real files into mcp/node_modules,
          # so Node 22 inside the caxa binary can resolve them.
          (cd mcp && pnpm install --prod --node-linker=hoisted --ignore-scripts)
          cp -rL mcp/node_modules stage/
          echo "STAGE=$(pwd)/stage" >> $GITHUB_ENV
      - name: Build standalone binary (caxa bundles Node 22)
        run: pnpm dlx @cdxgen/caxa --input "${{ env.STAGE }}" --output ${{ matrix.asset }} -- "{{caxa}}/node_modules/.bin/node" "{{caxa}}/dist/index.js"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  attach:
    needs: [gate, plugin-zip, binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: ls -la assets
      - name: Attach assets to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # NOTE: --repo is required — this job has no checkout, so gh
        # cannot resolve the repo from git remotes.
        run: gh release upload ${{ github.ref_name }} assets/* --clobber --repo chavisnguyen/FiMake
